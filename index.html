function launchMaze(){const el=document.createElement('div');el.className='arcade';el.innerHTML='<div>🟡 SIGNAL MAZE 2000 · Frecce per muovere · <span class="score">Nodi: 0</span></div><canvas width="448" height="320"></canvas><button data-reset>Nuova partita</button><div class="note" style="color:#ddd">Raccogli i nodi di segnale, evita i glitch mobili. Nessun segreto si attiva giocando normalmente.</div>';const canvas=el.querySelector('canvas'),ctx=canvas.getContext('2d');const map=['##############','#............#','#.##.##.##.###','#............#','#.###.##.##..#','#.....#......#','###.#.#.####.#','#...#........#','#.###.####.#.#','#............#','##############'];const tile=29;let cells,player,ghost,score,alive,frame=0;function reset(){cells=map.map(x=>x.split(''));player={x:1,y:1};ghost={x:12,y:9};score=0;alive=true;el.querySelector('.score').textContent='Nodi: 0'}reset();function draw(){ctx.fillStyle='#050610';ctx.fillRect(0,0,448,320);for(let y=0;y<cells.length;y++)for(let x=0;x<cells[y].length;x++){if(cells[y][x]==='#'){ctx.fillStyle='#2436aa';ctx.fillRect(x*tile,y*tile,tile-2,tile-2)}else if(cells[y][x]==='.'){ctx.fillStyle='#f2db88';ctx.beginPath();ctx.arc(x*tile+14,y*tile+14,3,0,7);ctx.fill()}}ctx.fillStyle='#ffe248';ctx.beginPath();ctx.arc(player.x*tile+14,player.y*tile+14,11,.2,Math.PI*1.8);ctx.lineTo(player.x*tile+14,player.y*tile+14);ctx.fill();ctx.fillStyle='#ff596f';ctx.beginPath();ctx.arc(ghost.x*tile+14,ghost.y*tile+14,11,Math.PI,0);ctx.lineTo(ghost.x*tile+25,ghost.y*tile+25);ctx.lineTo(ghost.x*tile+3,ghost.y*tile+25);ctx.fill();if(!alive){ctx.fillStyle='white';ctx.font='bold 24px monospace';ctx.fillText('PARTITA FINITA',114,150)}}function move(dx,dy){if(!alive)return;const nx=player.x+dx,ny=player.y+dy;if(cells[ny]?.[nx]!==undefined&&cells[ny][nx]!=='#'){player={x:nx,y:ny};if(cells[ny][nx]==='.'){score+=10;cells[ny][nx]=' ';el.querySelector('.score').textContent='Nodi: '+score;if(score>gameState.scores.maze){gameState.scores.maze=score;saveGame()}}}if(player.x===ghost.x&&player.y===ghost.y)alive=false;draw()}const w=createWindow('maze','Signal Maze 2000',el,{width:545,height:490});const keys=e=>{if(w.hidden||!w.isConnected||!w.classList.contains('active'))return;let a={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.key];if(a){e.preventDefault();move(...a)}};document.addEventListener('keydown',keys);const obs=new MutationObserver(()=>{if(!w.isConnected){document.removeEventListener('keydown',keys);obs.disconnect()}});obs.observe(document.body,{childList:true,subtree:true});el.querySelector('[data-reset]').onclick=()=>{reset();draw()};draw()}
function launchRunner(){const el=document.createElement('div');el.className='arcade';el.innerHTML='<div>🏃 PIXEL RUNNER 99 · ← → muovi · SPAZIO salta · <span class="score">Monete: 0</span></div><canvas width="540" height="285"></canvas><button data-reset>Ricomincia</button><div class="note" style="color:#ddd">Platform arcade dimostrativo: monete e ostacoli.</div>';const c=el.querySelector('canvas'),ctx=c.getContext('2d');let x,y,vy,points,coins,keys=new Set(),running,cam;function reset(){x=40;y=208;vy=0;points=0;cam=0;running=true;coins=Array.from({length:14},(_,i)=>({x:150+i*110,y:i%3===0?163:205,taken:false}));el.querySelector('.score').textContent='Monete: 0'}reset();const w=createWindow('runner','Pixel Runner 99',el,{width:630,height:440});const kd=e=>{if(!w.isConnected||!w.classList.contains('active'))return;if(['ArrowLeft','ArrowRight',' '].includes(e.key)){e.preventDefault();keys.add(e.key)}};const ku=e=>keys.delete(e.key);document.addEventListener('keydown',kd);document.addEventListener('keyup',ku);function tick(){if(!w.isConnected){document.removeEventListener('keydown',kd);document.removeEventListener('keyup',ku);return}if(!w.hidden&&running){if(keys.has('ArrowRight'))x+=3;if(keys.has('ArrowLeft'))x=Math.max(0,x-3);if(keys.has(' ')&&y>=208)vy=-11;vy+=.55;y=Math.min(208,y+vy);if(y>=208)vy=0;cam=Math.max(0,x-120);for(const a of coins)if(!a.taken&&Math.abs(a.x-x)<21&&Math.abs(a.y-y)<24){a.taken=true;points++;el.querySelector('.score').textContent='Monete: '+points;gameState.scores.runner=Math.max(gameState.scores.runner,points);saveGame()}}ctx.fillStyle='#609bd6';ctx.fillRect(0,0,540,285);ctx.fillStyle='#d7eafa';for(let i=0;i<7;i++)ctx.fillRect((i*140-cam*.15)%650,40+i%3*20,58,15);ctx.fillStyle='#3e7d43';ctx.fillRect(0,240,540,45);ctx.fillStyle='#a67b4d';ctx.fillRect(0,251,540,34);for(const a of coins)if(!a.taken){ctx.fillStyle='#ffdc46';ctx.beginPath();ctx.arc(a.x-cam+10,a.y+12,8,0,7);ctx.fill()}ctx.fillStyle='#dc3545';ctx.fillRect(x-cam,y,25,32);ctx.fillStyl (()=>{
 const desktop=document.getElementById('desktop');
 const menu=document.createElement('div');menu.className='nova-context';menu.hidden=true;menu.setAttribute('role','menu');document.body.appendChild(menu);
 let selected=null;
 function close(){menu.hidden=true;menu.replaceChildren();}
 function item(text,action){const b=document.createElement('button');b.type='button';b.textContent=text;b.setAttribute('role','menuitem');b.addEventListener('click',()=>{close();action()});menu.append(b)}
 function sep(){menu.append(document.createElement('hr'))}
 function openSelected(el){if(el&&el.dataset.app&&typeof openApp==='function')openApp(el.dataset.app)}
 function currentLabel(el){return el?.querySelector('span:last-child')?.textContent?.trim()||el?.getAttribute('aria-label')||'Elemento'}
 function novaNotice(message){const existing=document.getElementById('nova-shell-note');if(existing)existing.remove();const note=document.createElement('div');note.id='nova-shell-note';note.textContent=message;note.style.cssText='position:absolute;right:10px;bottom:46px;z-index:8800;background:#c0c0c0;color:#111;border:2px outset white;padding:11px 14px;max-width:280px;box-shadow:2px 3px #1115;font:13px Arial;';desktop.append(note);setTimeout(()=>note.remove(),2800)}
 function show(e){const target=e.target;if(!desktop.contains(target))return;
  if(target.closest('input,textarea,select,.web-page,canvas,[contenteditable="true"]'))return;const icon=target.closest('.desktop-icon');const win=target.closest('.window');const file=target.closest('.file-item');
  if(!(icon||win||file||target.closest('.desktop-icons')||target===desktop||target.closest('#windows')))return;
  e.preventDefault();e.stopPropagation();close();selected=icon||file||win||desktop;
  if(icon){document.querySelectorAll('.desktop-icon').forEach(x=>x.classList.remove('selected'));icon.classList.add('selected');item('Apri',()=>openSelected(icon));sep();item('Informazioni',()=>novaNotice(currentLabel(icon)+' — Applicazione NOVA OS 2000'));}
  else if(file){item('Apri',()=>file.click());sep();item('Proprietà',()=>novaNotice('Elemento dell’archivio locale'));}
  else if(win){item('Porta in primo piano',()=>{if(typeof focusWindow==='function')focusWindow(win.dataset.id)});item('Riduci a icona',()=>{const b=win.querySelector('.ctrl[title*="Min"],.ctrl[aria-label*="Min"]');if(b)b.click();else novaNotice('Usa il controllo nella barra del titolo.');});sep();item('Chiudi',()=>{const b=win.querySelector('.ctrl[title*="Chiu"],.ctrl[aria-label*="Chiu"]');if(b)b.click();else {const controls=win.querySelectorAll('.ctrl');controls[controls.length-1]?.click()}})}
  else {item('Aggiorna desktop',()=>{document.querySelectorAll('.desktop-icon').forEach(x=>x.classList.remove('selected'));novaNotice('Desktop aggiornato.');});item('Disponi icone',()=>{const icons=desktop.querySelector('.desktop-icons');icons.scrollTop=0;novaNotice('Icone disposte automaticamente.');});sep();item('Informazioni su NOVA 2000',()=>novaNotice('NOVA 2000 — sistema personale · dicembre 1999'));}
  menu.hidden=false;const rect=menu.getBoundingClientRect();menu.style.left=Math.max(2,Math.min(e.clientX,innerWidth-rect.width-4))+'px';menu.style.top=Math.max(2,Math.min(e.clientY,innerHeight-rect.height-4))+'px';
  menu.querySelector('button')?.focus();
 }
 desktop.addEventListener('contextmenu',show);
 document.addEventListener('pointerdown',e=>{if(!menu.contains(e.target))close()},true);
 document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
 window.addEventListener('blur',close);
})();
